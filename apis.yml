aid: nbn-co

name: NBN Co

description: 'NBN Co (styled "nbn") is the Australian Government-owned wholesale operator of the
  National Broadband Network, building and running the fixed-line, fixed wireless and satellite
  access network that retail service providers (RSPs) resell to homes and businesses across
  Australia. Its website describes the mission as "evolving Australia''s digital backbone to meet
  the ever-changing needs of people across the country." NBN Co does not publish a public developer
  API; its Wholesale Broadband Agreement Platform Interfacing Service terms describe B2B Access for
  contracted RSPs through an API gateway hosted by nbn and an nbn Developer Portal, both gated to
  wholesale customers. Surfaced via the API Evangelist harvest backlog (source: australia-apidays-2026).'

