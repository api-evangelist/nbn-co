apis:
- aid: nbn-co:nbn-platform-interfacing-service-b2b-access
  name: nbn Platform Interfacing Service (B2B Access)
  description: 'B2B Access under the Wholesale Broadband Agreement Platform Interfacing Service: contracted
    retail service providers integrate their RSP B2B Applications with an API gateway hosted by nbn,
    using digital certificates and API Credentials, per the B2B Specifications and the nbn Developer
    Portal, both of which nbn treats as confidential information supplied only to RSPs. No public base
    URL or machine-readable contract is published.'
  humanURL: https://www.nbnco.com.au/content/dam/nbn/documents/sell/wba/2024/sfaa-wba-nbn-platform-interfacing-service-service-terms-20241003.pdf.coredownload.pdf
